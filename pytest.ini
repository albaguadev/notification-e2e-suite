[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    unit_test: Unit tests for specific examples and edge cases
    property_test: Property-based tests using Hypothesis
    e2e_test: End-to-end user flow tests

# Output and reporting options
addopts =
    -v
    --tb=short
    --strict-markers
    --browser chromium
    --html=tests/reports/test_report.html
    --self-contained-html
    --screenshot=on
    --durations=10
    --capture=sys

# CI/CD Defaults (automatically detected when CI environment variable is set)
# Exit codes:
#  - 0: All tests passed (success)
#  - 1: Tests failed (failure)
#  - 2: Test execution interrupted (error)
#  - 5: No tests collected (error in test discovery)
#
# Headless Browser Mode Configuration:
# - Default: Headless mode enabled (PLAYWRIGHT_HEADLESS=1)
# - For CI/CD: Set PLAYWRIGHT_HEADLESS=1 environment variable
# - For development: Run with --headed flag to see browser UI
#
# Parallel Test Execution:
# - Run: pytest -n auto (requires pytest-xdist)
# - Workers: -n 4 for 4 workers, -n 8 for 8 workers
# - Distribution: --dist loadscope for better resource utilization
#
# Test Artifact Generation:
# - HTML reports: tests/reports/test_report_<browser>.html
# - Screenshots: tests/reports/screenshots/
# - JUnit XML: Can be enabled with --junit-xml=junit.xml
# - All artifacts are self-contained in HTML reports

# Pytest-HTML plugin configuration for detailed reporting
# - HTML report with detailed error information and stack traces
# - Execution time tracking for each test
# - Pass/fail status for all tests
# - Self-contained HTML with embedded resources for easy sharing
# - Screenshots automatically included via pytest-html

# Playwright-specific options
# Browser engines: chromium (default), firefox, webkit
# To run in headless mode (default): pytest
# To run in headed mode: pytest --headed
# To run with specific browser: pytest --browser firefox
# To run with multiple browsers: pytest --browser chromium --browser firefox --browser webkit
# Screenshot capture: automatically enabled for all tests (--screenshot=on)
# Parallel execution optimization: pytest -n auto (requires pytest-xdist)
# Property-based tests: Hypothesis with 25-100 iterations per property
# Execution time tracking: --durations=10 shows slowest 10 tests
