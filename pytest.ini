[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    unit_test: Unit tests for specific examples and edge cases
    property_test: Property-based tests using Hypothesis
    e2e_test: End-to-end user flow tests

# Output and reporting options
addopts =
    -v
    --tb=short
    --strict-markers
    --browser chromium
    --html=reports/test_report.html
    --self-contained-html
    --screenshot=on

# Playwright-specific options
# Browser engines: chromium (default), firefox, webkit
# To run in headless mode (default): pytest
# To run in headed mode: pytest --headed
# To run with specific browser: pytest --browser firefox
# To run with multiple browsers: pytest --browser chromium --browser firefox --browser webkit
# Screenshot capture: automatically enabled for all tests (--screenshot=on)
# Parallel execution optimization: pytest -n auto (requires pytest-xdist)
# Property-based tests: Hypothesis with 25-100 iterations per property
