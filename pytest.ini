[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    unit_test: Unit tests for specific examples and edge cases
    property_test: Property-based tests using Hypothesis
    e2e_test: End-to-end user flow tests

# Output and reporting options
addopts =
    -v
    --tb=short
    --strict-markers
    --browser chromium
    --headed

# Playwright-specific options
# To run in headless mode, use: pytest --browser chromium
# To run in headed mode, use: pytest --browser chromium --headed
# To run with specific browser, use: pytest --browser firefox or pytest --browser webkit
