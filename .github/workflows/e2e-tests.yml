name: E2E Test Suite CI/CD

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
        browser: ['chromium', 'firefox', 'webkit']
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            browser: chromium
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-0 \
            libnss3 \
            libnspr4 \
            libdbus-1-3 \
            libatk1.0-0 \
            libcups2 \
            libdrm2 \
            libxcb1 \
            libxkbcommon0 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 \
            libgtk-3-0
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-xdist
      
      - name: Install Playwright browsers (headless mode)
        run: |
          playwright install --with-deps
          playwright install-deps
      
      - name: Run E2E tests (Headless mode) - ${{ matrix.browser }}
        run: |
          pytest \
            --browser ${{ matrix.browser }} \
            --html=tests/reports/test_report_${{ matrix.browser }}.html \
            --self-contained-html \
            -n auto \
            -v
        env:
          PLAYWRIGHT_HEADLESS: "1"
          CI: "true"
        continue-on-error: true
      
      - name: Run property-based tests with parallel execution
        run: |
          pytest tests/property/ \
            --browser ${{ matrix.browser }} \
            --html=tests/reports/property_report_${{ matrix.browser }}.html \
            --self-contained-html \
            -n auto \
            -v \
            --tb=short
        env:
          PLAYWRIGHT_HEADLESS: "1"
          CI: "true"
        continue-on-error: true
      
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}-${{ matrix.browser }}
          path: tests/reports/
          retention-days: 30
          compression-level: 9
      
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.python-version }}-${{ matrix.browser }}
          path: tests/reports/screenshots/
          retention-days: 7
      
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ matrix.python-version }}-${{ matrix.browser }}
          path: tests/reports/
      
      - name: Check test exit code
        if: always()
        run: |
          # Check if HTML report exists and parse results
          if [ -f "tests/reports/test_report_${{ matrix.browser }}.html" ]; then
            echo "✓ Test report generated successfully"
            exit 0
          else
            echo "✗ Test report not found"
            exit 1
          fi

  parallel-test:
    name: Parallel Test Execution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-xdist
      
      - name: Install Playwright
        run: |
          playwright install --with-deps
      
      - name: Run tests in parallel (4 workers)
        run: |
          pytest \
            -n 4 \
            --dist loadscope \
            --html=tests/reports/parallel_test_report.html \
            --self-contained-html \
            -v
        env:
          PLAYWRIGHT_HEADLESS: "1"
          CI: "true"
      
      - name: Upload parallel test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-test-reports
          path: tests/reports/
          retention-days: 30

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [test, parallel-test]
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
      
      - name: Display test results summary
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ HTML Test Reports (with embedded screenshots)" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Screenshot captures (all tests)" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Test execution metrics" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ JUnit compatibility" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Multi-Browser Testing" >> $GITHUB_STEP_SUMMARY
          echo "- Chromium" >> $GITHUB_STEP_SUMMARY
          echo "- Firefox" >> $GITHUB_STEP_SUMMARY
          echo "- WebKit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Python Versions Tested" >> $GITHUB_STEP_SUMMARY
          echo "- 3.8, 3.9, 3.10, 3.11" >> $GITHUB_STEP_SUMMARY
